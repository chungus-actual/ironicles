name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -W ignore tests/test_api.py
      - run: python tools/seed_demo.py --db /tmp/demo.db --months 4
      - run: node -e "new Function(require('fs').readFileSync('backend/static/app.js','utf8'))"
